name: drivingsim
options:
  bundleIdPrefix: de.innoactive.drivingsim
  deploymentTarget:
    visionOS: "27.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "6.0"
    XROS_DEPLOYMENT_TARGET: "27.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    SWIFT_STRICT_CONCURRENCY: complete

packages:
  swift-log:
    url: https://github.com/apple/swift-log.git
    from: 1.6.0

targets:
  drivingsim:
    type: application
    platform: visionOS
    sources:
      - path: Sources
    dependencies:
      - package: swift-log
        product: Logging
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.innoactive.drivingsim
        PRODUCT_NAME: drivingsim
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSHandsTrackingUsageDescription: "Hand tracking drives the in-sim controls when no wheel is connected."
        INFOPLIST_KEY_NSWorldSensingUsageDescription: "World sensing places the driving world relative to your space."
        INFOPLIST_KEY_GCSupportedGameControllers: "ExtendedGamepad"
        INFOPLIST_KEY_GCSupportsControllerUserInteraction: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        SUPPORTS_MACCATALYST: NO
        TARGETED_DEVICE_FAMILY: "7"
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES